name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # 纯 Node 断言，无第三方依赖，不需要 npm install
      - run: npm test
      # samples.js 是确定性产物，重跑应无差异
      - run: npm run samples
      - run: git diff --exit-code prototype/samples.js
